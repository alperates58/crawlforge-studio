services:
  postgres:
    image: postgres:16-alpine
    container_name: crawlforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crawlforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
      POSTGRES_DB: ${POSTGRES_DB:-crawlforge}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - crawlforge_net

  redis:
    image: redis:7-alpine
    container_name: crawlforge-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - crawlforge_net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: crawlforge-api
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    volumes:
      - app_storage:/app/storage
    networks:
      - crawlforge_net
      - coolify
    expose:
      - '3001'
    command:
      - sh
      - -lc
      - |
        set -e
        until node -e "const net=require('net'); const s=net.connect(5432,'postgres'); s.on('connect',()=>process.exit(0)); s.on('error',()=>process.exit(1)); setTimeout(()=>process.exit(1),1000)"; do
          echo "waiting for postgres..."
          sleep 2
        done
        npm run db:push --workspace=@crawlforge/database
        npm run seed:prod --workspace=@crawlforge/api
        exec npm run start --workspace=@crawlforge/api
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.crawlforge-api.entrypoints=https'
      - 'traefik.http.routers.crawlforge-api.rule=Host(`databot.alperates.com.tr`) && PathPrefix(`/api`)'
      - 'traefik.http.routers.crawlforge-api.priority=100'
      - 'traefik.http.routers.crawlforge-api.middlewares=crowdsec@file'
      - 'traefik.http.routers.crawlforge-api.service=crawlforge-api'
      - 'traefik.http.routers.crawlforge-api.tls=true'
      - 'traefik.http.routers.crawlforge-api.tls.certresolver=letsencrypt'
      - 'traefik.http.services.crawlforge-api.loadbalancer.server.port=3001'
      - 'traefik.docker.network=coolify'

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: crawlforge-worker
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    volumes:
      - app_storage:/app/storage
    networks:
      - crawlforge_net

  ai-worker:
    build:
      context: .
      dockerfile: apps/ai-worker/Dockerfile
    container_name: crawlforge-ai-worker
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - api
    networks:
      - crawlforge_net

  scheduler-worker:
    build:
      context: .
      dockerfile: apps/scheduler-worker/Dockerfile
    container_name: crawlforge-scheduler-worker
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - api
    networks:
      - crawlforge_net

  recorder-worker:
    build:
      context: .
      dockerfile: apps/recorder-worker/Dockerfile
    container_name: crawlforge-recorder-worker
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - api
    networks:
      - crawlforge_net
      - coolify
    expose:
      - '3002'
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.crawlforge-recorder.entrypoints=https'
      - 'traefik.http.routers.crawlforge-recorder.rule=Host(`databot.alperates.com.tr`) && PathPrefix(`/recorder-ws`)'
      - 'traefik.http.routers.crawlforge-recorder.priority=100'
      - 'traefik.http.routers.crawlforge-recorder.middlewares=crowdsec@file'
      - 'traefik.http.routers.crawlforge-recorder.service=crawlforge-recorder'
      - 'traefik.http.routers.crawlforge-recorder.tls=true'
      - 'traefik.http.routers.crawlforge-recorder.tls.certresolver=letsencrypt'
      - 'traefik.http.services.crawlforge-recorder.loadbalancer.server.port=3002'
      - 'traefik.docker.network=coolify'

  ocr-worker:
    build:
      context: .
      dockerfile: apps/ocr-worker/Dockerfile
    container_name: crawlforge-ocr-worker
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - api
    volumes:
      - app_storage:/app/storage
    networks:
      - crawlforge_net



  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: crawlforge-web
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - crawlforge_net
    expose:
      - '3000'

volumes:
  postgres_data:
  redis_data:
  app_storage:

networks:
  crawlforge_net:
    driver: bridge
  coolify:
    external: true
